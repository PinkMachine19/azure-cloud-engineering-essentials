<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Journey Documents</title><style>body{font:18px system-ui;max-width:48rem;margin:4rem auto;padding:1rem;color:#17212b}form{display:flex;gap:.5rem}input,button{font:inherit;padding:.6rem}input{flex:1}li{margin:.6rem 0}</style></head><body><h1>Cloud Journey Documents</h1><p>A deliberately small workload that will evolve throughout the course.</p><form id="form"><label for="name">Document name</label><input id="name" required><button>Add</button></form><p id="status" role="status"></p><h2>Queue</h2><ul id="items"></ul><script>const form=document.querySelector('#form'),items=document.querySelector('#items'),status=document.querySelector('#status');async function load(){const data=await fetch('/api/documents').then(r=>r.json());items.innerHTML=data.map(x=>`<li><strong>${x.name}</strong> — ${x.status}</li>`).join('')}form.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/documents',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value})});status.textContent=r.ok?'Document queued.':'Could not queue document.';if(r.ok){form.reset();load()}});load()</script></body></html>
